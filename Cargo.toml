[workspace]
resolver = "2"
members = [
    "crates/irys-core",
    "crates/irys-light",
    "crates/irys-prims",
    "crates/irys-gpu",
    "crates/irys",
    "crates/irys-diff",
    "crates/kosm-render",
    "crates/irys-bench",
    "crates/irys-recon",
    "crates/irys-recon-net",
    "crates/irys-ffi",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Cam Pedersen <cam@campedersen.com>"]
repository = "https://github.com/ecto/irys"
rust-version = "1.95"

[workspace.dependencies]
# crates.io tang, so a clean clone needs no sibling checkout. kosm's manifest
# sends crates.io `tang` to its git rev; here the registry copy is the only one.
# `.cargo/config.toml.example` points it at a local checkout instead.
tang = "0.2"
rayon = "1"
# The tensor IR (`tang_compile::tensor::TensorGraph`) for irys-diff's kernels.
# tang-compile is not on crates.io yet, so it is pinned by rev — the same rev
# kosm pins — and `[patch.crates-io]` below sends crates.io `tang` and
# `tang-expr` to that rev, so the graph still holds one `tang`. irys-diff is
# the only crate that names it; the published crates still resolve `tang = "0.2"`.
tang-compile = { git = "https://github.com/ecto/tang", rev = "bfc8003" }
tang-expr = "0.1"
irys-core  = { path = "crates/irys-core", version = "0.1" }
irys-light = { path = "crates/irys-light", version = "0.1" }
irys-prims = { path = "crates/irys-prims", version = "0.1" }
irys-gpu   = { path = "crates/irys-gpu", version = "0.1" }
irys       = { path = "crates/irys", version = "0.1" }

# One tang: the rev tang-compile is pinned to. Drop with tang-compile's publish.
[patch.crates-io]
tang      = { git = "https://github.com/ecto/tang", rev = "bfc8003" }
tang-expr = { git = "https://github.com/ecto/tang", rev = "bfc8003" }
