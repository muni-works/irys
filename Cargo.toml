[package]
name = "kosm-render"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The light: rays, acceleration structures and a path tracer over any geometry that can be bounded and hit"

[dependencies]
tang.workspace = true
# The GPU tier. `bytemuck` and `wgpu` only; the wasm glue below is what a
# browser needs to await a buffer mapping without blocking.
wgpu = { version = "30", features = ["webgpu", "wgsl"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = "1"
pollster = { version = "0.4", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
js-sys = { version = "0.3", optional = true }

[features]
default = []
gpu = [
    "dep:wgpu",
    "dep:bytemuck",
    "dep:pollster",
    "dep:wasm-bindgen",
    "dep:wasm-bindgen-futures",
    "dep:js-sys",
]
