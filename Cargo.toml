[workspace]
resolver = "2"
members = [
    "crates/irys-core",
    "crates/irys-light",
    "crates/irys-prims",
    "crates/irys-gpu",
    "crates/irys",
    "crates/irys-diff",
    "crates/kosm-render",
    "crates/irys-bench",
    "crates/irys-recon",
    "crates/irys-tags",
    "crates/irys-recon-net",
    "crates/irys-ffi",
    "crates/irys-splat",
    "crates/irys-wasm",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Cam Pedersen <cam@campedersen.com>"]
repository = "https://github.com/muni-works/irys"
rust-version = "1.95"

[workspace.dependencies]
# crates.io tang, so a clean clone needs no sibling checkout. kosm's manifest
# sends crates.io `tang` to its git rev; here the registry copy is the only one.
# `.cargo/config.toml.example` points it at a local checkout instead.
tang = "0.2"
rayon = "1"
# The tensor IR (`tang_compile::tensor::TensorGraph`) for irys-diff's kernels
# and irys-recon-net. All three from crates.io, so a host that links irys
# (vcad's Mac app) needs no `[patch]` of its own to keep one `tang`.
tang-compile = "0.1.2"
tang-expr = "0.2"
irys-core  = { path = "crates/irys-core", version = "0.1" }
irys-light = { path = "crates/irys-light", version = "0.1" }
irys-prims = { path = "crates/irys-prims", version = "0.1" }
irys-gpu   = { path = "crates/irys-gpu", version = "0.1" }
irys       = { package = "irys-render", path = "crates/irys", version = "0.1" }
irys-tags  = { path = "crates/irys-tags", version = "0.1" }

[patch.crates-io]
# irys-diff's rose_brep example builds vcad 0.11 (d10f279), whose raytracer
# needs kosm-render ahead of crates.io 0.2.0: the rev vcad itself patches to.
kosm-render = { git = "https://github.com/ecto/kosm", rev = "59b1d03ec45cf9e9a04ccbbbef0bcc06d8f559d4" }
