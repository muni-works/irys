[package]
name = "irys-recon"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "irys: image to CAD, v0 — recover a vcad program and its dimensions from irys renders"
publish = false

[dependencies]
irys-core.workspace = true
irys-prims.workspace = true
irys-light.workspace = true
irys-diff = { path = "../irys-diff", features = ["assets"] }
# 0.10 or 0.11: a host on vcad 0.11 (the Mac app) unifies with one `[patch]`.
vcad-kernel = ">=0.10, <0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
# v1: tag36h11 detection (irys-tags, pure Rust, Apache-2.0), EXIF focal length (MIT),
# STL export (vcad's own exporter), threads for the photo renderer.
irys-tags.workspace = true
kamadak-exif = "0.6"
vcad-kernel-export = ">=0.10, <0.12"
vcad-ir = ">=0.10, <0.12"
rayon.workspace = true

[features]
# The synthetic photos are rendered with irys's OpenPBR scene kernel on the
# device (`look::scene_gpu`); only `examples/recon_v1` needs it.
gpu = ["irys-diff/gpu"]

[[example]]
name = "recon_v0"


[[example]]
name = "recon_v1"
required-features = ["gpu"]
