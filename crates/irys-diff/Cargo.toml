[package]
name = "irys-diff"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "irys: the kernel contract on CPU — BSDFs as tang IR graphs, path replay backprop"
publish = false

[dependencies]
irys-core.workspace = true
irys-light.workspace = true
irys-prims.workspace = true
tang.workspace = true
tang-compile.workspace = true
tang-expr.workspace = true
# dlopen for the compiled C kernels. tang-gpu's `CpuProgram` does the same,
# but tang-gpu links wgpu 25 and irys is on 30 (principle 4).
# Phase 2a: the wavefront on the device, through irys-gpu's wgpu 30 context.
irys-gpu = { workspace = true, optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.4", optional = true }
# Skin: the glTF head and its JPEG maps (`skin::mesh::load`). Optional, so
# the kernel crates never decode an asset.
gltf = { version = "1.4", default-features = false, features = ["utils"], optional = true }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }
# Phase 5a: the Blender export's sidecar (`blend::load`).
serde_json = { version = "1", optional = true }
rayon = { workspace = true }

[features]
gpu = ["dep:irys-gpu", "dep:bytemuck", "dep:pollster"]
assets = ["dep:gltf", "dep:image", "dep:serde_json"]

[[example]]
name = "fit_gpu"
required-features = ["gpu"]

[[example]]
name = "fit_scene"
required-features = ["gpu"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libloading = "0.8"

[dev-dependencies]
# examples/rover: muni's BVR1 rover built from vcad parts and tessellated
# by vcad's own kernel. A dev-dependency only: no irys crate depends on vcad.
vcad = { version = "0.10", default-features = false }
# examples/rose: rose-full.loon's chest panels are sketch extrusions, which
# only the kernel's `Solid` exposes. The same 0.10 vcad already pulls in.
vcad-kernel = "0.10"
# examples/rose_brep: the shared rose-arm benchmark with vcad's differentiable
# BRep seam ("Exact Gradients Through a BRep Kernel"): irys's per-vertex edge
# gradient pulled back to a CAD dimension by vcad-kernel-diff. Pinned to the
# vcad commit the kernel paper reports.
vcad-kernel-next = { package = "vcad-kernel", git = "https://github.com/ecto/vcad", rev = "d10f279d9693d307c7faa7289ec6490b12f0bd77", default-features = false }
vcad-kernel-diff = { git = "https://github.com/ecto/vcad", rev = "d10f279d9693d307c7faa7289ec6490b12f0bd77" }

[[example]]
name = "rover"
required-features = ["gpu"]

[[example]]
name = "rose"
required-features = ["gpu"]

