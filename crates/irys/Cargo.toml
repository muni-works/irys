[package]
name = "irys-render"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "The light: rays, acceleration structures and a path tracer over any geometry that can be bounded and hit"
readme = "README.md"
keywords = ["raytracing", "pathtracing", "renderer", "bvh", "graphics"]
categories = ["graphics", "rendering", "rendering::engine"]
exclude = ["out/", "tests/snapshots/"]

# Published as irys-render (the irys name on crates.io belongs to another
# project); the library keeps its name, so code still writes `use irys::`.
[lib]
name = "irys"

[dependencies]
irys-core.workspace = true
irys-light.workspace = true
irys-prims.workspace = true
irys-gpu = { workspace = true, optional = true }

[dev-dependencies]
# The GPU tests reach wgpu as `irys::gpu::wgpu`; these two are small.
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"

[features]
default = []
# The wgpu compute tier, as `irys::gpu`. Off by default; the CPU path tracer
# needs nothing but tang and rayon.
gpu = ["dep:irys-gpu"]
